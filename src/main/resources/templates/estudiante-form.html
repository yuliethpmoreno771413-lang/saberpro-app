<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Formulario Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3 class="text-primary">Registrar / Editar Estudiante</h3>
    <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post" class="card p-4 mt-3 shadow-sm">

        <div class="row">
            <div class="col-md-4">
                <label>Tipo Documento</label>
                <input type="text" th:field="*{tipoDocumento}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Documento</label>
                <input type="text" th:field="*{documento}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Número de Registro</label>
                <input type="text" th:field="*{numeroRegistro}" class="form-control">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-3"><label>Primer Nombre</label><input type="text" th:field="*{primerNombre}" class="form-control"></div>
            <div class="col-md-3"><label>Segundo Nombre</label><input type="text" th:field="*{segundoNombre}" class="form-control"></div>
            <div class="col-md-3"><label>Primer Apellido</label><input type="text" th:field="*{primerApellido}" class="form-control"></div>
            <div class="col-md-3"><label>Segundo Apellido</label><input type="text" th:field="*{segundoApellido}" class="form-control"></div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4"><label>Correo Electrónico</label><input type="email" th:field="*{correo}" class="form-control"></div>
            <div class="col-md-4"><label>Teléfono</label><input type="text" th:field="*{telefono}" class="form-control"></div>
            <div class="col-md-4"><label>Programa</label><input type="text" th:field="*{programa}" class="form-control"></div>
        </div>

        <div class="mt-4 text-center">
            <button type="submit" class="btn btn-success px-4">Guardar</button>
            <a href="/estudiantes" class="btn btn-secondary px-4">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
