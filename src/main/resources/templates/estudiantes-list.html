<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Gestión de Estudiantes SaberPro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body style="background-color:#f8f9fa;">

<div class="container mt-4">
    <h3 class="text-primary mb-3">Listado de Estudiantes</h3>
    <a href="/panel" class="btn btn-link mb-3">← Volver al Panel</a>
    <a href="/estudiantes/nuevo" class="btn btn-success mb-3">+ Nuevo Estudiante</a>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary text-center">
        <tr>
            <th>Tipo Doc</th>
            <th>Documento</th>
            <th>Primer Nombre</th>
            <th>Segundo Nombre</th>
            <th>Primer Apellido</th>
            <th>Segundo Apellido</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Programa</th>
            <th>Número Registro</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${estudiantes}">
            <td th:text="${e.tipoDocumento}">CC</td>
            <td th:text="${e.documento}">1005245306</td>
            <td th:text="${e.primerNombre}">Dayron</td>
            <td th:text="${e.segundoNombre}">Jerez</td>
            <td th:text="${e.primerApellido}">Gomez</td>
            <td th:text="${e.segundoApellido}">Ortiz</td>
            <td th:text="${e.correo}">correo@gmail.com</td>
            <td th:text="${e.telefono}">1234567890</td>
            <td th:text="${e.programa}">Ingeniería</td>
            <td th:text="${e.numeroRegistro}">EK2025012345</td>
            <td class="text-center">
                <a th:href="@{'/estudiantes/editar/' + ${e.id}}" class="btn btn-warning btn-sm">✏️</a>
                <a th:href="@{'/estudiantes/eliminar/' + ${e.id}}"
                   onclick="return confirm('¿Seguro que deseas eliminar este estudiante?');"
                   class="btn btn-danger btn-sm">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
