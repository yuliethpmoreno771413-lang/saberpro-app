<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados Detallados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <a href="/resultados" class="btn btn-link">← Volver</a>

    <div class="card shadow-sm p-4">
        <h3 class="text-primary mb-3">Resultados Detallados</h3>

        <h5 class="text-secondary">Información del Estudiante</h5>
        <table class="table table-bordered">
            <tr><th>Nombre</th><td th:text="${estudiante.primerNombre + ' ' + estudiante.primerApellido}"></td></tr>
            <tr><th>Documento</th><td th:text="${estudiante.documento}"></td></tr>
            <tr><th>Programa</th><td th:text="${estudiante.programa}"></td></tr>
            <tr><th>Número de Registro</th><td th:text="${resultado.numeroRegistro}"></td></tr>
            <tr><th>Puntaje Total</th><td th:text="${resultado.puntajeTotal}"></td></tr>
            <tr>
                <th>Nivel de Desempeño</th>
                <td>
                    <span th:text="${estado}"
                          th:classappend="${estado=='Avanzado' ? 'badge bg-success'
                          : (estado=='Competente' ? 'badge bg-primary'
                          : (estado=='Básico' ? 'badge bg-warning text-dark'
                          : 'badge bg-danger'))}">
                    </span>
                </td>
            </tr>
            <tr><th>Fecha de Registro</th><td th:text="${resultado.fecha}"></td></tr>
        </table>

        <h5 class="text-secondary mt-4">Resultados por Materia</h5>
        <table class="table table-bordered">
            <thead class="table-primary">
            <tr>
                <th>Materia</th>
                <th>Puntaje</th>
                <th>Nivel</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${resultado.materias}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.puntaje}"></td>
                <td>
                        <span th:text="${m.puntaje < 180 ? 'No alcanzó nivel' :
                                      (m.puntaje < 210 ? 'Básico' :
                                      (m.puntaje < 240 ? 'Competente' : 'Avanzado'))}"
                              th:classappend="${m.puntaje < 180 ? 'badge bg-danger' :
                                             (m.puntaje < 210 ? 'badge bg-warning text-dark' :
                                             (m.puntaje < 240 ? 'badge bg-primary' : 'badge bg-success'))}">
                        </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
