<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <a href="/panel" class="navbar-brand"><i class="bi bi-arrow-left"></i> Volver al Panel</a>
        <span class="navbar-text">Gestión de Calificaciones</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3 class="text-primary">Listado de Resultados</h3>
        <a href="/resultados/nuevo" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Resultado</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>Registro</th>
            <th>ID Estudiante</th>
            <th>Puntaje Total</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${resultados}">
            <td th:text="${r.numeroRegistro}"></td>
            <td th:text="${r.estudianteId}"></td>
            <td th:text="${r.puntajeTotal}"></td>
            <td th:text="${r.fecha}"></td>
            <td>
                <a th:href="@{/resultados/ver/{id}(id=${r.id})}" class="btn btn-info btn-sm">
                    <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/resultados/eliminar/{id}(id=${r.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Deseas eliminar este resultado?')">
                    <i class="bi bi-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
